name: HRMOS DOM audit
on:
  push:
    paths:
      - '.github/workflows/hrmos-dom-audit.yml'
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Inspect live HRMOS repeat controls
        shell: bash
        run: |
          python -m pip install --quiet selenium
          cat > /tmp/audit.py <<'PY'
          import json, time
          from selenium import webdriver
          from selenium.webdriver.chrome.options import Options

          URL='https://hrmos.co/pages/mun/jobs/02_03/apply'
          opt=Options()
          opt.add_argument('--headless=new')
          opt.add_argument('--no-sandbox')
          opt.add_argument('--disable-dev-shm-usage')
          opt.add_argument('--window-size=1440,2200')
          opt.add_argument('--lang=ja-JP')
          opt.add_experimental_option('prefs', {'intl.accept_languages':'ja-JP,ja,en-US,en'})
          d=webdriver.Chrome(options=opt)
          try:
              d.get(URL)
              time.sleep(4)
              print('URL', d.current_url)
              print('TITLE', d.title)
              controls=d.execute_script(r'''
                const sel='button,a,input[type="button"],input[type="submit"],[role="button"],[tabindex="0"]';
                return [...document.querySelectorAll(sel)].map(e=>{
                  const text=(e.innerText||e.textContent||e.value||e.getAttribute('aria-label')||e.getAttribute('title')||'').replace(/\s+/g,' ').trim();
                  return {tag:e.tagName,type:e.type||'',role:e.getAttribute('role'),text:text.slice(0,240),cls:String(e.className||'').slice(0,220),outer:e.outerHTML.slice(0,1400)};
                }).filter(x=>x.text);
              ''')
              print('=== CLICKABLE CONTROLS ===')
              print(json.dumps(controls,ensure_ascii=False,indent=2))
              fields=d.execute_script(r'''
                return [...document.querySelectorAll('input,select,textarea')].filter(e=>e.type!=='hidden').map(e=>{
                  let txt='';
                  for(let p=e.parentElement,depth=0;p&&depth<6;p=p.parentElement,depth++){
                    const t=(p.innerText||p.textContent||'').replace(/\s+/g,' ').trim();
                    if(t && t.length<260){txt=t;break;}
                  }
                  return {tag:e.tagName,type:e.type||'',name:e.name||'',placeholder:e.placeholder||'',aria:e.getAttribute('aria-label')||'',near:txt.slice(0,240),outer:e.outerHTML.slice(0,800)};
                });
              ''')
              print('=== FIELDS ===')
              print(json.dumps(fields,ensure_ascii=False,indent=2))
              # Click the strongest work-experience add candidate in either locale.
              clicked=d.execute_script(r'''
                const rx=/(職歴\s*を?\s*追加|職歴.*追加|add\s+(another\s+)?(work\s+)?(experience|employment|career)|add\s+employment\s+history)/i;
                const els=[...document.querySelectorAll('button,a,input[type="button"],input[type="submit"],[role="button"],[tabindex="0"],div,span')];
                const cand=[];
                for(const e of els){
                  const t=(e.innerText||e.textContent||e.value||e.getAttribute('aria-label')||e.getAttribute('title')||'').replace(/\s+/g,' ').trim();
                  if(!t || !rx.test(t) || t.length>120) continue;
                  const tag=e.tagName.toLowerCase(), role=e.getAttribute('role'); let s=0;
                  if(tag==='button')s+=100;if(tag==='input')s+=95;if(role==='button')s+=90;if(tag==='a')s+=80;if(e.tabIndex>=0)s+=25;if(getComputedStyle(e).cursor==='pointer')s+=15;
                  s-=Math.max(0,t.length-16);
                  cand.push({e,s,t});
                }
                cand.sort((a,b)=>b.s-a.s);
                if(!cand.length)return null;
                const x=cand[0], before=document.querySelectorAll('input,select,textarea').length;
                x.e.click();
                return {text:x.t,score:x.s,tag:x.e.tagName,before,outer:x.e.outerHTML.slice(0,1800)};
              ''')
              print('=== CLICKED WORK ADD ===')
              print(json.dumps(clicked,ensure_ascii=False,indent=2))
              time.sleep(2)
              after=d.execute_script(r'''
                const buttons=[...document.querySelectorAll('button,a,input[type="button"],[role="button"]')].map(e=>(e.innerText||e.textContent||e.value||e.getAttribute('aria-label')||'').replace(/\s+/g,' ').trim()).filter(Boolean);
                const fields=[...document.querySelectorAll('input,select,textarea')].filter(e=>e.type!=='hidden');
                return {fieldCount:fields.length, addTexts:buttons.filter(t=>/(職歴|work|employment|career)/i.test(t)).slice(0,30), tailFields:fields.slice(-16).map(e=>({tag:e.tagName,type:e.type||'',name:e.name||'',placeholder:e.placeholder||'',outer:e.outerHTML.slice(0,700)}))};
              ''')
              print('=== AFTER CLICK ===')
              print(json.dumps(after,ensure_ascii=False,indent=2))
          finally:
              d.quit()
          PY
          python /tmp/audit.py
