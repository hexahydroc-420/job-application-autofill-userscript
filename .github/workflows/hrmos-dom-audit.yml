name: HRMOS v4.3.1 live validation
on:
  push:
    paths:
      - '.github/workflows/hrmos-dom-audit.yml'
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Apply v4.3.1 repeat-control patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('job-application-autofill.user.js')
          s=p.read_text(encoding='utf-8')
          s=s.replace('// @version      4.3.0','// @version      4.3.1',1)
          s=s.replace('複数プロフィールをGUIで管理し、学歴・職歴・資格・企業独自回答をドラッグや上下ボタンで並べ替え可能。プルダウン、ラジオ・チェックボックス・複数選択にも対応します。','複数プロフィールをGUIで管理し、学歴・職歴・資格・企業独自回答を並べ替え可能。HRMOS等の「職歴を追加」型の動的追加にも対応し、プルダウン・ラジオ・チェックボックス・複数選択も補助します。',1)
          old='''  function findButton(regex) {\n    return all('button, a, [role="button"]').find(btn => regex.test(clean(btn.innerText || btn.textContent || btn.getAttribute('aria-label')))) || null;\n  }\n\n  async function ensureEntryCount(anchorRegex, buttonRegex, count) {\n    if (!count || count < 1) return;\n    for (let guard = 0; guard < Math.min(12, count + 3); guard++) {\n      const current = getRoots().reduce((n, root) => n + Math.max(rowsMatching(anchorRegex, root).length, controlsMatching(anchorRegex, root).filter(el => !(el instanceof HTMLInputElement && ['radio','checkbox'].includes(el.type))).length), 0);\n      if (current >= count) break;\n      const button = findButton(buttonRegex);\n      if (!button) break;\n      button.click();\n      await sleep(180);\n    }\n  }\n'''
          new='''  // 繰り返し項目では「セクション全体の文言」に引っ張られると、\n  // 会社名以外の入力欄まで会社名候補として数えてしまう。\n  // 行/ラベル/placeholder/近傍の短い文言だけを使う強判定を別途用意する。\n  function strongControlsMatching(regex, scope = null, options = {}) {\n    const { tag = null, type = null, excludeNegative = true } = options;\n    return visibleControls(scope).filter(el => {\n      if (tag && el.tagName.toLowerCase() !== tag) return false;\n      if (type && !(el instanceof HTMLInputElement && el.type === type)) return false;\n      const info = labelInfo(el);\n      if (excludeNegative && SENSITIVE_NEGATIVE_RX.test(info.combined)) return false;\n      const direct = clean([\n        info.rowLabel, info.label, info.radioLabel, info.aria, info.placeholder,\n        info.nameAttr, info.idAttr, info.dataTestId\n      ].filter(Boolean).join(' | '));\n      if (direct && regex.test(direct)) return true;\n      return !!(info.nearText && info.nearText.length <= 180 && regex.test(info.nearText));\n    });\n  }\n\n  function countEntryAnchors(anchorRegex) {\n    return getRoots().reduce((total, root) => {\n      const rows = rowsMatching(anchorRegex, root);\n      if (rows.length) return total + rows.length;\n      const controls = strongControlsMatching(anchorRegex, root).filter(el =>\n        !(el instanceof HTMLInputElement && ['radio', 'checkbox'].includes(el.type))\n      );\n      return total + controls.length;\n    }, 0);\n  }\n\n  function actionText(el) {\n    return clean(\n      el?.innerText || el?.textContent || el?.value ||\n      el?.getAttribute?.('aria-label') || el?.getAttribute?.('title') || ''\n    );\n  }\n\n  function findButton(regex) {\n    const selector = [\n      'button[hrm-append-button]', '[hrm-append-button]',\n      'button', 'input[type="button"]', 'input[type="submit"]',\n      'a', '[role="button"]', '[aria-pressed]', '[tabindex="0"]'\n    ].join(',');\n    const candidates = all(selector).filter(el => {\n      if (el.disabled || el.getAttribute?.('aria-disabled') === 'true') return false;\n      const text = actionText(el);\n      return !!text && text.length <= 180 && regex.test(text);\n    }).map((el, index) => {\n      const tag = el.tagName.toLowerCase();\n      const text = actionText(el);\n      let score = 0;\n      if (el.hasAttribute?.('hrm-append-button')) score += 300;\n      if (tag === 'button') score += 120;\n      if (tag === 'input') score += 105;\n      if (el.getAttribute?.('role') === 'button') score += 95;\n      if (tag === 'a') score += 70;\n      if (el.tabIndex >= 0) score += 20;\n      if (clean(el.getAttribute?.('aria-label'))) score += 10;\n      score -= Math.min(80, Math.max(0, text.length - 24));\n      return { el, score, index };\n    });\n    candidates.sort((a, b) => b.score - a.score || a.index - b.index);\n    return candidates[0]?.el || null;\n  }\n\n  async function waitForEntryGrowth(anchorRegex, before, timeoutMs = 1800) {\n    const started = Date.now();\n    while (Date.now() - started < timeoutMs) {\n      await sleep(80);\n      const current = countEntryAnchors(anchorRegex);\n      if (current > before) return current;\n    }\n    return countEntryAnchors(anchorRegex);\n  }\n\n  async function ensureEntryCount(anchorRegex, buttonRegex, count) {\n    if (!count || count < 1) return;\n    for (let guard = 0; guard < Math.min(16, count + 5); guard++) {\n      const current = countEntryAnchors(anchorRegex);\n      if (current >= count) break;\n      const button = findButton(buttonRegex);\n      if (!button) break;\n      try {\n        button.click();\n      } catch (_) {\n        try {\n          button.dispatchEvent(new MouseEvent('click', { bubbles: true, cancelable: true, view: window }));\n        } catch (_) {}\n      }\n      const grown = await waitForEntryGrowth(anchorRegex, current);\n      if (grown <= current) break;\n    }\n  }\n'''
          if old not in s: raise SystemExit('repeat block not found')
          s=s.replace(old,new,1)
          old2='''    let controls = controlsMatching(regex, scope, { excludeNegative: true });\n    if (controlFilter) controls = controls.filter(controlFilter);\n    return fillControl(controls[occurrence], value);\n'''
          new2='''    let controls = strongControlsMatching(regex, scope, { excludeNegative: true });\n    if (!controls.length) controls = controlsMatching(regex, scope, { excludeNegative: true });\n    if (controlFilter) controls = controls.filter(controlFilter);\n    return fillControl(controls[occurrence], value);\n'''
          if old2 not in s: raise SystemExit('fillNthRow block not found')
          s=s.replace(old2,new2,1)
          s=s.replace('/(add\\s*(another\\s*)?(work\\s*)?(experience|employment)|職歴.*追加|職歴を追加)/i','/(add\\s*(another\\s*)?(work\\s*)?(experience|employment(?:\\s*history)?|career)|職歴.*追加|職歴を追加|経歴.*追加|勤務歴.*追加)/i',1)
          p.write_text(s,encoding='utf-8')
          PY
          node --check job-application-autofill.user.js
          grep -q '@version      4.3.1' job-application-autofill.user.js
      - name: Validate on live HRMOS page
        shell: bash
        run: |
          python -m pip install --quiet selenium
          cat > /tmp/live_test.py <<'PY'
          import json, time, pathlib
          from selenium import webdriver
          from selenium.webdriver.chrome.options import Options
          URL='https://hrmos.co/pages/mun/jobs/02_03/apply'
          works=[{'companyName':f'TEST COMPANY {i}'} for i in range(1,5)]
          store={'version':4,'activeId':'test','settings':{'workAddPosition':'prepend'},'profiles':[{'id':'test','name':'TEST','data':{'workExperience':works}}]}
          opt=Options(); opt.add_argument('--headless=new'); opt.add_argument('--no-sandbox'); opt.add_argument('--disable-dev-shm-usage'); opt.add_argument('--window-size=1440,2200'); opt.add_argument('--lang=ja-JP'); opt.add_experimental_option('prefs',{'intl.accept_languages':'ja-JP,ja,en-US,en'})
          d=webdriver.Chrome(options=opt)
          try:
              d.get(URL); time.sleep(4)
              exact=d.execute_script(r'''return [...document.querySelectorAll('button[hrm-append-button]')].map(b=>(b.innerText||b.textContent||'').replace(/\s+/g,' ').trim())''')
              print('APPEND_BUTTONS',json.dumps(exact,ensure_ascii=False))
              assert '職歴を追加' in exact, exact
              store_js=json.dumps(store,ensure_ascii=False)
              d.execute_script(f"window.__testStore={store_js}; window.GM_getValue=(k,d)=>k==='job-application-autofill-public-profiles-v1'?JSON.stringify(window.__testStore):d; window.GM_setValue=(k,v)=>{{window.__saved=v;}}; window.GM_registerMenuCommand=()=>{{}}; window.GM_addStyle=(css)=>{{const s=document.createElement('style');s.textContent=css;document.head.appendChild(s);return s;}};")
              d.execute_script(pathlib.Path('job-application-autofill.user.js').read_text(encoding='utf-8'))
              time.sleep(.5)
              title=d.execute_script("return document.querySelector('#job-autofill-panel .profile-select')?.selectedOptions?.[0]?.textContent || document.querySelector('#job-autofill-panel')?.innerText || ''")
              print('PANEL',title[:300])
              d.execute_script("document.querySelector('#job-autofill-panel [data-act=fill]').click()")
              time.sleep(5)
              result=d.execute_script(r'''
                const inputs=[...document.querySelectorAll('input[type="text"]')].filter(e=>{
                  for(let p=e.parentElement,depth=0;p&&depth<5;p=p.parentElement,depth++){
                    const t=(p.innerText||p.textContent||'').replace(/\s+/g,' ').trim();
                    if(/^会社名(?:\s+必須)?$/.test(t)) return true;
                    if(t.length>100) break;
                  }
                  return false;
                });
                return {count:inputs.length,values:inputs.map(e=>e.value),status:document.querySelector('#job-autofill-panel .hrmos-af-status')?.textContent||''};
              ''')
              print('LIVE_RESULT',json.dumps(result,ensure_ascii=False))
              assert result['count'] == 4, result
              assert result['values'] == [f'TEST COMPANY {i}' for i in range(1,5)], result
          finally:
              d.quit()
          PY
          python /tmp/live_test.py
      - name: Update documentation and publish
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('README.md')
          s=p.read_text(encoding='utf-8')
          marker='## v4.3.1\n'
          note='''## v4.3.1\n\n- HRMOSの `hrm-append-button` を使う「学歴を追加」「職歴を追加」「資格を追加」を明示的に検出します。\n- 繰り返し項目の件数判定を改善し、職歴セクション内の別入力欄を職歴件数として誤カウントしにくくしました。\n- 追加後のDOM生成を待ってから次の項目を追加するため、非同期描画のフォームにも対応しやすくしました。\n- `input[type=button]`、ARIA button等の追加コントロールも汎用候補へ追加しました。\n- 実ページ `hrmos.co/pages/mun/jobs/02_03/apply` で、初期1件から4件へ職歴を増やして4社分を入力するテストを実施しています。応募確認・送信は行っていません。\n\n'''
          if marker not in s:
              pos=s.find('## 特徴')
              s=s[:pos]+note+s[pos:] if pos>=0 else s+'\n\n'+note
          p.write_text(s,encoding='utf-8')
          PY
          git rm .github/workflows/hrmos-dom-audit.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add job-application-autofill.user.js README.md
          git commit -m 'feat: support HRMOS dynamic repeat buttons'
          git push
