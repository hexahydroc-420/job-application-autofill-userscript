name: HRMOS DOM audit
on:
  push:
    paths:
      - '.github/workflows/hrmos-dom-audit.yml'
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Test current public UserScript on live HRMOS page
        shell: bash
        run: |
          python -m pip install --quiet selenium
          cat > /tmp/audit.py <<'PY'
          import json, time, pathlib
          from selenium import webdriver
          from selenium.webdriver.chrome.options import Options

          URL='https://hrmos.co/pages/mun/jobs/02_03/apply'
          works=[]
          for i in range(4):
              works.append({
                  'companyName':f'TEST COMPANY {i+1}', 'departmentTitle':'TEST DEPT', 'occupation':'TEST ROLE',
                  'employmentType':'正社員','startYear':str(2023+i%3),'startMonth':'1','endYear':'2026','endMonth':'1',
                  'currentlyWorking':False,'responsibilities':f'TEST DUTIES {i+1}'
              })
          store={'version':4,'activeId':'test','settings':{'workAddPosition':'prepend'},'profiles':[{'id':'test','name':'TEST','data':{'workExperience':works}}]}
          opt=Options(); opt.add_argument('--headless=new'); opt.add_argument('--no-sandbox'); opt.add_argument('--disable-dev-shm-usage'); opt.add_argument('--window-size=1440,2200'); opt.add_argument('--lang=ja-JP'); opt.add_experimental_option('prefs',{'intl.accept_languages':'ja-JP,ja,en-US,en'})
          d=webdriver.Chrome(options=opt)
          try:
              d.get(URL); time.sleep(4)
              before=d.execute_script("return [...document.querySelectorAll('input')].filter(e=>{let p=e.parentElement;for(let i=0;p&&i<5;i++,p=p.parentElement){if((p.innerText||'').replace(/\\s+/g,' ').trim().startsWith('会社名'))return true}return false}).length")
              print('COMPANY_FIELDS_BEFORE',before)
              store_json=json.dumps(json.dumps(store,ensure_ascii=False))
              d.execute_script(f"window.__gmStore={store_json}; window.GM_getValue=(k,d)=>k==='job-application-autofill-public-profiles-v1'?window.__gmStore:d; window.GM_setValue=(k,v)=>{{window.__gmStore=v;}}; window.GM_registerMenuCommand=()=>{{}}; window.GM_addStyle=(css)=>{{const s=document.createElement('style');s.textContent=css;document.head.appendChild(s);return s;}};")
              script=pathlib.Path('job-application-autofill.user.js').read_text(encoding='utf-8')
              d.execute_script(script)
              time.sleep(1)
              panel=d.find_element('css selector','#job-autofill-panel')
              fill=panel.find_element('css selector','[data-act="fill"]')
              fill.click()
              time.sleep(4)
              data=d.execute_script(r'''
                const candidates=[...document.querySelectorAll('input')].filter(e=>{
                  for(let p=e.parentElement,depth=0;p&&depth<6;p=p.parentElement,depth++){
                    const t=(p.innerText||p.textContent||'').replace(/\s+/g,' ').trim();
                    if(/^会社名(?:\s+必須)?$/.test(t))return true;
                    if(t.length>80)break;
                  }
                  return false;
                });
                return {count:candidates.length, values:candidates.map(e=>e.value), addButtons:[...document.querySelectorAll('button[hrm-append-button]')].map(b=>(b.innerText||b.textContent||'').replace(/\s+/g,' ').trim()), status:document.querySelector('#job-autofill-panel .hrmos-af-status')?.textContent||''};
              ''')
              print('RESULT',json.dumps(data,ensure_ascii=False))
          finally:
              d.quit()
          PY
          python /tmp/audit.py
