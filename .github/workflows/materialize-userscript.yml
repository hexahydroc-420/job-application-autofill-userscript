name: Materialize public UserScript

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract public UserScript
        run: |
          test -f public-payload.zip
          unzip -o public-payload.zip
          rm public-payload.zip
          rm .github/workflows/materialize-userscript.yml
      - name: Commit generated file
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "release: materialize public UserScript"
          git push
